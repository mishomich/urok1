<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Първи урок</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <h1>Здравей, свят!</h1>
        <p>Това е моята първа HTML страница.</p>

        <h2>Какво научих:</h2>
        <ul>
            <li>Структура на HTML документ</li>
            <li>Заглавия и параграфи</li>
            <li>Списъци и връзки</li>
        </ul>

        <p><a href="https://developer.mozilla.org/bg/docs/Web/HTML">Научи повече за HTML</a></p>

        <h2>Забавна част 🎉</h2>
        <p id="fact">Натисни бутона за случаен факт!</p>
        <button id="factBtn">Дай ми факт</button>
        <p class="clock-line">Часът е: <span id="clock">--:--:--</span></p>
        <p class="hint">Подсказка: кликни върху заглавието за изненада ✨</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
